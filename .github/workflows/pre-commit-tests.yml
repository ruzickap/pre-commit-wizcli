name: pre-commit-tests

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main
    paths:
      - .pre-commit-hooks.yaml
      - .github/workflows/pre-commit-tests.yml
      - tests/**
  # Weekly run catches breaking changes in the latest wizcli
  schedule:
    - cron: 27 6 * * 1

defaults:
  run:
    shell: bash -euxo pipefail {0}

permissions: read-all

jobs:
  pre-commit-test:
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04-arm, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔧 Install dependencies and run tests (tests/run-all-tests.sh)
        env:
          WIZ_CLIENT_ID: ${{ secrets.WIZ_CLIENT_ID }}
          WIZ_CLIENT_SECRET: ${{ secrets.WIZ_CLIENT_SECRET }}
        run: |
          command -v brew > /dev/null || eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install prek wizcli
          ./tests/run-all-tests.sh
